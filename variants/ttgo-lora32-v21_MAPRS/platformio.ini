; APRS LoRa+ MAPRS transponder (Manuel - EA7JRS, 2026-11-13): transpondedor AIS por APRS LoRa, clase B, en la LilyGO T3 v1.6.1
; (LoRa32 V2.1, SX1278 de 433 MHz). Mismo hardware que ttgo-lora32-v21_GPS; arranca con el perfil nautico AIS y saca NMEA
; (AIS de las estaciones oidas y barco propio como !AIVDO) por BLE (servicio de control, PIN) o Bluetooth clasico (modo NMEA).
[env:ttgo-lora32-v21_MAPRS]
extends = env:esp32
board = ttgo-lora32-v21
build_flags =
	${common.build_flags}
	-D RADIOLIB_EXCLUDE_LR11X0=1
	-D RADIOLIB_EXCLUDE_SX126X=1
	-D RADIOLIB_EXCLUDE_SX128X=1
	-D TTGO_LORA32_V2_1_GPS
	-D APRS_MAPRS_TRANSPONDER
lib_deps =
	${common.lib_deps}
	${common.display_libs}
	adafruit/Adafruit SH110X @ 2.1.15
