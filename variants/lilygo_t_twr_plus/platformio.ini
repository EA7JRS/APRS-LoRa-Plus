; LilyGO T-TWR Plus (Rev2.0 / Rev2.1) con radio FM SA868: APRS AFSK 1200 en VHF. Copyright (C) 2026 Manuel - EA7JRS
[env:lilygo_t_twr_plus]
extends = env:esp32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.psram_type = opi
build_flags =
	${common.build_flags}
	${common.usb_flags}
	-D RADIOLIB_EXCLUDE_LR11X0=1
	-D RADIOLIB_EXCLUDE_SX127X=1
	-D RADIOLIB_EXCLUDE_SX128X=1
	-D LILYGO_T_TWR_PLUS
	-D HAS_SA868
	-D BOARD_HAS_PSRAM
lib_deps =
	${common.lib_deps}
	${common.display_libs}
	lewisxhe/XPowersLib @ 0.3.3
	adafruit/Adafruit SH110X @ 2.1.15
; sin radio LoRa: RadioLib (en common) no se compila en esta placa
lib_ignore = RadioLib
