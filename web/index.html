<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APRS LoRa+ · Instalador / Installer</title>
<!-- Copyright (C) 2026 Manuel - EA7JRS. GPL-3.0. Web installer for APRS LoRa+ (uses ESP Web Tools, Apache-2.0) -->
<style>
    :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#5b6670; --card:#ffffff; --line:#d8dde3; --accent:#0b6bcb; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
    @media (prefers-color-scheme: dark) {
        :root { --bg:#12161b; --fg:#e6e9ed; --muted:#9aa5b1; --card:#1b2128; --line:#2f3842; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 0 0 8px; }
    p { margin: 0 0 10px; }
    .sub { color: var(--muted); margin-bottom: 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    select, button.btn { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    select { width: 100%; }
    button.btn { cursor: pointer; border-color: var(--accent); color: var(--accent); }
    button.btn:disabled { opacity: .5; cursor: default; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .status { margin-top: 10px; min-height: 1.5em; }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    small, .muted { color: var(--muted); }
    #lang { float:right; }
    esp-web-install-button button { font: inherit; padding: 12px 18px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
    ul { margin: 6px 0 0 18px; padding: 0; }
    .head { display:flex; align-items:center; gap:12px; margin-bottom:4px; }
    .head .logo { height:56px; width:auto; flex-shrink:0; }
    .head h1 { margin:0; }
    .dev { display:flex; gap:8px; flex-wrap:wrap; }
    .dev button { flex:1 1 140px; font: inherit; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; text-align:left; }
    .dev button b { display:block; }
    .dev button small { display:block; }
    .dev button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
    a.dl { display:inline-block; padding: 12px 18px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
    <button class="btn" id="lang" type="button">English</button>
    <div class="head"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="25 15 890 985" role="img" aria-label="APRS LoRa+"><rect x="25" y="15" width="890" height="985" rx="60" fill="#000000"/><g id="ondas" fill="#19AE19" stroke="#19AE19" stroke-width="18" stroke-linejoin="round"><path d="M57.4 229.9 A551 551 0 0 1 881 229.9 L864.5 244.1 A529.2 529.2 0 0 0 73.9 244.1 Z"/><path d="M146.4 301.4 A437 437 0 0 1 792 301.4 L776.1 315.4 A415.8 415.8 0 0 0 162.3 315.4 Z"/><path d="M240.1 368.5 A322.9 322.9 0 0 1 698.3 368.5 L682.4 383.5 A301 301 0 0 0 256 383.5 Z"/></g><path id="pin" fill="#109110" stroke="#109110" stroke-width="18" stroke-linejoin="round" d="M179.3 421.3 A302 302 0 0 0 170.1 563.9 C173.6 544.2 161.1 718.2 467.5 975.3 C773.9 718.2 761.4 544.2 764.9 563.9 A302 302 0 0 0 756.3 423.1 L706.9 454.7 A246 246 0 1 1 228.6 452.8 Z"/><g id="lmas" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"><path d="M350.7 397.9 L340.5 411.5 L340.5 623.8 L380.6 655.5 L547.7 655.5 L598.5 623.5 L598.5 615.5 L399.4 613.5 L386.5 591.2 L386.5 387.1 Z"/><path d="M554.7 385.8 L546.2 390.7 L540.1 446.8 L483.4 457.9 L478.9 471.5 L482.7 477.8 L534.8 483.9 L546.8 543.9 L565.9 546.3 L574.7 540.4 L579.9 489.3 L637.4 477.2 L641.1 463.9 L635.5 456.3 L585.3 451.1 L572.2 389.8 Z"/></g></svg><h1>APRS LoRa+</h1></div>
    <p class="sub" data-i="sub"></p>

    <div class="card" id="unsupported" hidden>
        <p class="bad" data-i="nobrowser"></p>
    </div>

    <div class="card">
        <h2 data-i="s0"></h2>
        <div class="dev" id="devices">
            <button type="button" data-dev="tracker"><b>Tracker</b><small data-i="dTracker"></small></button>
            <button type="button" data-dev="rotor"><b>Rotor</b><small data-i="dRotor"></small></button>
            <button type="button" data-dev="gateway"><b>Gateway</b><small data-i="dGateway"></small></button>
        </div>
    </div>

    <div class="card">
        <h2 data-i="s1"></h2>
        <p class="muted" data-i="s1help"></p>
        <div class="row"><button class="btn" id="detect" type="button" data-i="detect"></button></div>
        <div class="status" id="detectStatus"></div>
    </div>

    <div class="card">
        <h2 data-i="s2"></h2>
        <label for="board" data-i="board"></label>
        <select id="board"></select>
        <div class="status" id="avail"></div>
    </div>

    <div class="card">
        <h2 data-i="s3"></h2>
        <p class="muted" data-i="s3help"></p>
        <esp-web-install-button id="install"></esp-web-install-button>
        <div id="uf2" hidden><p><a class="dl" id="uf2link" href="#" download data-i="uf2btn"></a></p><p class="muted" data-i="uf2help"></p></div>
        <ul class="muted">
            <li data-i="n1"></li>
            <li data-i="n2"></li>
            <li data-i="n3"></li>
        </ul>
    </div>

    <p><small><span data-i="foot"></span> <a href="https://github.com/EA7JRS/APRS-LoRa-Plus">github.com/EA7JRS/APRS-LoRa-Plus</a></small></p>
    <p id="privBox" hidden><small class="muted" data-i="priv"></small></p>
</main>

<script type="module" src="https://unpkg.com/esp-web-tools@10.4.0/dist/web/install-button.js?module"></script>
<script>
(function () {
    "use strict";
    const T = {
        es: {
            sub: "Instala o actualiza el firmware conectando la placa por USB. Funciona en Chrome o Edge (ordenador o Android).",
            s0: "Dispositivo", dTracker: "Tracker APRS multimodo (LoRa, FSK, CW, WSPR, SAT…)", dRotor: "Control de rotor de antenas compatible con Hamlib", dGateway: "iGate / pasarela APRS LoRa+",
            devNone: "Aún no hay versión publicada de este dispositivo en el instalador.", otherDev: "La placa conectada es otro dispositivo: ",
            uf2btn: "Descargar firmware (.uf2)", uf2help: "Raspberry Pi Pico 2 / Pico 2 W: conéctala con el botón BOOTSEL pulsado, aparece una unidad USB (RP2350); copia en ella el archivo .uf2 y la placa se reinicia con el firmware nuevo. La configuración se conserva.",
            nobrowser: "Este navegador no puede hablar con el puerto USB (Web Serial). Usa Chrome o Edge en un ordenador, o Chrome en Android con cable OTG.",
            s1: "1. Reconocer la placa conectada", s1help: "Conecta la placa por USB y pulsa el botón: se lee la placa y la versión instalada.",
            detect: "Detectar placa", s2: "2. Versión disponible", board: "Placa", s3: "3. Instalar / actualizar",
            s3help: "Se conserva la configuración guardada en la placa (indicativo, WiFi, pines…). Cierra otros programas que usen el puerto serie.",
            n1: "Si la placa no aparece en la lista de puertos, mantén pulsado BOOT mientras la conectas.",
            n2: "Las placas con dos copias de firmware (p. ej. T-Beam S3 Supreme) también se pueden actualizar desde la web de configuración de la propia placa.",
            n3: "Una instalación por USB repone la tabla de particiones; el primer arranque puede tardar unos segundos.",
            foot: "Proyecto de código abierto (GPL-3.0). Instalador basado en ESP Web Tools.",
            priv: "Contador anónimo de visitas e instalaciones (GoatCounter): sin cookies, sin IP ni datos personales; solo cuenta la visita y la placa elegida.",
            reading: "Leyendo la placa…", noanswer: "La placa no ha respondido. Tiene que llevar un firmware APRS LoRa+ (tracker 5.3.1 o posterior, rotor o gateway 5.3.4 o posterior); si no, elige el dispositivo y la placa a mano.",
            found: "Placa detectada: ", installed: "versión instalada ", newer: "Hay una versión más nueva: ", uptodate: "Ya tienes la última versión (", unknownBoard: "Esa placa no está en la lista de esta versión.",
            avail: "Versión disponible: ", loading: "Cargando lista de placas…", loadfail: "No se pudo cargar la lista de placas.", otaYes: "actualización web desde la propia placa: sí", otaNo: "esta placa solo se actualiza por USB",
            pick: "— elige tu placa —", noport: "No se ha elegido ningún puerto.", err: "Error: "
        },
        en: {
            sub: "Install or update the firmware by connecting the board over USB. Works in Chrome or Edge (computer or Android).",
            s0: "Device", dTracker: "Multimode APRS tracker (LoRa, FSK, CW, WSPR, SAT…)", dRotor: "Hamlib-compatible antenna rotor controller", dGateway: "APRS LoRa+ iGate / gateway",
            devNone: "No release of this device is in the installer yet.", otherDev: "The connected board is another device: ",
            uf2btn: "Download firmware (.uf2)", uf2help: "Raspberry Pi Pico 2 / Pico 2 W: plug it in while holding BOOTSEL, a USB drive (RP2350) shows up; copy the .uf2 file to it and the board restarts with the new firmware. Settings are kept.",
            nobrowser: "This browser cannot talk to the USB port (Web Serial). Use Chrome or Edge on a computer, or Chrome on Android with an OTG cable.",
            s1: "1. Recognise the connected board", s1help: "Connect the board over USB and press the button: the board and the installed version are read.",
            detect: "Detect board", s2: "2. Available version", board: "Board", s3: "3. Install / update",
            s3help: "The settings stored in the board (callsign, WiFi, pins…) are kept. Close other programs that use the serial port.",
            n1: "If the board does not show in the port list, hold BOOT while plugging it in.",
            n2: "Boards with two firmware copies (e.g. T-Beam S3 Supreme) can also be updated from the board's own configuration web page.",
            n3: "A USB install rewrites the partition table; the first boot may take a few seconds.",
            foot: "Open source project (GPL-3.0). Installer based on ESP Web Tools.",
            priv: "Anonymous visit and install counter (GoatCounter): no cookies, no IP or personal data; it only counts the visit and the chosen board.",
            reading: "Reading the board…", noanswer: "The board did not answer. It must run APRS LoRa+ firmware (tracker 5.3.1 or later, rotor or gateway 5.3.4 or later); otherwise pick the device and the board by hand.",
            found: "Board detected: ", installed: "installed version ", newer: "A newer version is available: ", uptodate: "You already have the latest version (", unknownBoard: "That board is not in this release.",
            avail: "Available version: ", loading: "Loading board list…", loadfail: "Could not load the board list.", otaYes: "update from the board's own web page: yes", otaNo: "this board is updated over USB only",
            pick: "— choose your board —", noport: "No port selected.", err: "Error: "
        }
    };
    let lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
    const $ = id => document.getElementById(id);
    let latest = null, detected = null, device = "tracker", loadFailed = false;
    const BASE = { tracker: "", rotor: "rotor/", gateway: "gateway/" };
    const base = () => BASE[device];

    // Contador anonimo (EA7JRS): GoatCounter (https://www.goatcounter.com), gratuito, sin cookies ni datos personales.
    // Para activarlo crea una cuenta, elige un codigo (p. ej. "ea7jrs") y ponlo aqui; vacio = sin contador y sin conexion a terceros.
    const GOATCOUNTER_CODE = "";
    function ev(name) {                                           // evento (visita ya cuenta sola): detect/<placa>, install-start/<placa>, install-ok/<placa>, install-error/<placa>
        try { if (GOATCOUNTER_CODE && window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: name, event: true }); } catch (e) {}
    }
    function boardNow() { const v = $("board") ? $("board").value : ""; return v || (detected && detected.board) || "unknown"; }
    if (GOATCOUNTER_CODE) {
        const s = document.createElement("script");
        s.async = true; s.src = "https://gc.zgo.at/count.js";
        s.setAttribute("data-goatcounter", "https://" + GOATCOUNTER_CODE + ".goatcounter.com/count");
        document.head.appendChild(s);
        $("privBox").hidden = false;
        // Instalacion: ESP Web Tools avisa con "state-changed" (finished / error); si esa version no lo emitiera, solo se cuenta el inicio
        const onState = e => {
            const st = e && e.detail && e.detail.state;
            if (st === "finished") ev("install-ok/" + boardNow());
            else if (st === "error") ev("install-error/" + boardNow());
        };
        document.addEventListener("state-changed", onState, true);
        window.addEventListener("state-changed", onState, true);
        $("install").addEventListener("click", () => ev("install-start/" + boardNow()), true);
    }
    const t = k => T[lang][k];

    function cmp(a, b) {
        const pa = String(a).split(/[.\-]/).map(n => parseInt(n, 10) || 0), pb = String(b).split(/[.\-]/).map(n => parseInt(n, 10) || 0);
        for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0); }
        return 0;
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

    function render() {
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i]").forEach(e => { e.textContent = t(e.dataset.i); });
        $("lang").textContent = lang === "es" ? "English" : "Español";
        document.querySelectorAll("[data-dev]").forEach(b => b.classList.toggle("on", b.dataset.dev === device));
        fillBoards();
        showAvail();
    }

    function fillBoards() {
        const sel = $("board"), keep = sel.value;
        sel.innerHTML = "";
        const first = document.createElement("option");
        first.value = ""; first.textContent = latest ? t("pick") : (loadFailed ? t("devNone") : t("loading"));
        sel.appendChild(first);
        if (latest) {
            Object.keys(latest.boards).sort().forEach(name => {
                const o = document.createElement("option");
                o.value = name; o.textContent = name;
                sel.appendChild(o);
            });
            sel.value = keep;
        }
    }

    function showAvail() {
        const name = $("board").value, box = $("avail"), inst = $("install"), uf2 = $("uf2");
        box.className = "status";
        uf2.hidden = true;
        if (!latest || !name) {
            box.textContent = loadFailed ? t("devNone") : ""; if (loadFailed) box.className = "status warn";
            inst.removeAttribute("manifest"); inst.style.display = "none"; return;
        }
        const b = latest.boards[name];
        let html = esc(t("avail")) + "<strong>" + esc(b.version) + "</strong> · " + esc(b.ota ? t("otaYes") : t("otaNo"));
        if (detected && detected.board === name) {
            const d = cmp(b.version, detected.version);
            if (d > 0) html += '<br><span class="warn">' + esc(t("newer") + b.version + " (" + t("installed") + detected.version + ")") + "</span>";
            else html += '<br><span class="ok">' + esc(t("uptodate") + detected.version + ")") + "</span>";
        }
        box.innerHTML = html;
        if (b.uf2) {                                              // Raspberry Pi Pico 2: se copia el .uf2 a la unidad de BOOTSEL
            inst.removeAttribute("manifest"); inst.style.display = "none";
            $("uf2link").href = base() + b.uf2;
            uf2.hidden = false;
            return;
        }
        inst.setAttribute("manifest", base() + "manifests/" + name + ".json");
        inst.style.display = "";
    }

    function load(dev) {
        device = dev; latest = null; loadFailed = false;
        render();
        fetch(base() + "latest.json?_t=" + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(j => { latest = j; if (detected && (detected.device || "tracker") === device && latest.boards[detected.board]) $("board").value = detected.board; render(); })
            .catch(() => { loadFailed = true; render(); });
    }

    async function detect() {
        const st = $("detectStatus");
        st.className = "status"; st.textContent = t("reading");
        let port;
        try { port = await navigator.serial.requestPort(); }
        catch (e) { st.textContent = t("noport"); return; }
        let info = null;
        try {
            await port.open({ baudRate: 115200 });
            const writer = port.writable.getWriter();
            const dec = new TextDecoder();
            const reader = port.readable.getReader();
            const enc = new TextEncoder();
            let buf = "";
            const t0 = Date.now();
            let lastAsk = 0;
            while (Date.now() - t0 < 7000 && !info) {
                if (Date.now() - lastAsk > 1500) { lastAsk = Date.now(); try { await writer.write(enc.encode("\nAPRS-INFO?\n")); } catch (e) {} }
                const r = await Promise.race([reader.read(), new Promise(res => setTimeout(() => res(null), 600))]);
                if (r && r.value) buf += dec.decode(r.value, { stream: true });
                const m = /APRS-LoRa-Plus: (?:device=(\S+) )?board=(\S+) version=(\S+) chip=(\S+) ota=(\d)/.exec(buf);
                if (m) info = { device: m[1] || "tracker", board: m[2], version: m[3], chip: m[4], ota: m[5] === "1" };
                if (r && r.done) break;
            }
            try { await reader.cancel(); } catch (e) {}
            reader.releaseLock();
            writer.releaseLock();
        } catch (e) {
            st.className = "status bad"; st.textContent = t("err") + e.message;
        }
        try { await port.close(); } catch (e) {}
        if (!info) { if (!st.textContent.startsWith(t("err"))) { st.className = "status warn"; st.textContent = t("noanswer"); } return; }
        detected = info;
        ev("detect/" + info.board);
        st.className = "status ok";
        st.textContent = t("found") + info.device + " · " + info.board + " · " + t("installed") + info.version + " · " + info.chip;
        if (info.device !== device) { load(info.device in BASE ? info.device : "tracker"); return; }      // otro dispositivo: se cambia solo
        if (latest && latest.boards[info.board]) $("board").value = info.board;
        else if (latest) { st.className = "status warn"; st.textContent += " — " + t("unknownBoard"); }
        showAvail();
    }

    $("lang").addEventListener("click", () => { lang = lang === "es" ? "en" : "es"; render(); });
    $("board").addEventListener("change", showAvail);
    $("detect").addEventListener("click", detect);
    document.querySelectorAll("[data-dev]").forEach(b => b.addEventListener("click", () => { if (b.dataset.dev !== device) load(b.dataset.dev); }));

    if (!("serial" in navigator)) { $("unsupported").hidden = false; $("detect").disabled = true; }
    const want = (location.hash || "").replace("#", "");          // enlace directo: ...APRS-LoRa-Plus/#rotor
    load(want in BASE ? want : "tracker");
})();
</script>
</body>
</html>
