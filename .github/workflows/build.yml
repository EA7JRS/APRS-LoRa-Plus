name: Build Release

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Publicar sobre una release ya creada (p. ej. v5.3.1): compila esa etiqueta, adjunta los .zip y despliega el instalador. Vacio = solo compilar"
                required: false
                default: ""

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                target:
                    - name: ttgo-t-beam-v1
                      chip: esp32
                    - name: ttgo-t-beam-v1_915
                      chip: esp32
                    - name: ttgo-t-beam-v1_SX1268
                      chip: esp32
                    - name: ttgo-t-beam-v1_SX1262
                      chip: esp32
                    - name: ttgo-t-beam-v1_2
                      chip: esp32
                    - name: ttgo-t-beam-v1_2_915
                      chip: esp32
                    - name: ttgo-t-beam-v1_2_SX1262
                      chip: esp32
                    - name: ttgo_t_beam_s3_SUPREME_v3
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: ttgo-t-beam-1W
                      chip: esp32s3
                      flash_size: 16MB
                      flash_mode: dio
                      spiffs_offset: "0xc90000"
                    - name: ttgo_t_deck_GPS
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: ttgo_t_deck_plus
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: ttgo-t-beam-v0_7
                      chip: esp32
                    - name: heltec_wireless_tracker
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: heltec_wifi_lora_32_V3_GPS
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: heltec_wifi_lora_32_V3_TNC
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: heltec_wifi_lora_32_V3_2_GPS
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: heltec_wifi_lora_32_V3_2_TNC
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: heltec_wireless_stick_lite_v3_display_GPS
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: heltec_wireless_stick_lite_v3_TNC
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: heltec-lora32-v2_GPS
                      chip: esp32
                    - name: heltec-lora32-v2_915_GPS
                      chip: esp32
                    - name: ttgo-lora32-v21_GPS
                      chip: esp32
                    - name: ttgo-lora32-v21_915_GPS
                      chip: esp32
                    - name: ttgo-lora32-v21_TNC
                      chip: esp32
                    - name: ttgo-lora32-v21_915_TNC
                      chip: esp32
                    - name: ttgo_lora32_t3s3_v1_2_GPS
                      chip: esp32s3
                      flash_size: 4MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: ESP32_DIY_LoRa_SX1278_GPS
                      chip: esp32
                    - name: ESP32_DIY_LoRa_915_SX1276_GPS
                      chip: esp32
                    - name: ESP32S3_DIY_LoRa_SX1278_GPS
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: ESP32S3_DIY_LoRa_915_SX1276_GPS
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: ESP32_DIY_1W_LoRa_E22_400M30S_GPS
                      chip: esp32
                    - name: ESP32_DIY_1W_LoRa_915_E22_900M30S_GPS
                      chip: esp32
                    - name: ESP32_DIY_1W_LoRa_E220_400M30S_GPS
                      chip: esp32
                    - name: OE5HWN_MeshCom
                      chip: esp32
                    - name: WEMOS_ESP32_Bat_DIY_LoRa_SX1278_GPS
                      chip: esp32
                    - name: ESP32C3_SuperMini_DIY_LoRa_SX1278_GPS
                      chip: esp32c3
                    - name: ESP32C3_SuperMini_DIY_LoRa_915_SX1276_GPS
                      chip: esp32c3
                    - name: heltec_ht-ct62_GPS
                      chip: esp32c3
                    - name: QRPLabs_LightTracker_Plus_1_0
                      chip: esp32s3
                      flash_size: 8MB
                      flash_mode: dio
                      spiffs_offset: "0x310000"
                    - name: TROY_LoRa_APRS
                      chip: esp32
                    - name: F4GOH_1W_LoRa_Tracker_E22_400M30S
                      chip: esp32
                    - name: F4GOH_1W_LoRa_Tracker_E220_400M30S
                      chip: esp32
                    - name: Hydra_1W_LoRa_E22_400M30S_GPS
                      chip: esp32
                    - name: RPC_Electronics_1W_LoRa_GPS
                      chip: esp32
                    - name: RPC_MicroTracker
                      chip: esp32
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.tag }}

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install esptool
              run: pip install "esptool>=5,<6"

            - name: Install PlatformIO Core
              run: pip install --upgrade platformio

            - name: Build target
              run: |
                  pio run -e ${{ matrix.target.name }}

            - name: Build FS
              run: |
                  pio run --target buildfs -e ${{ matrix.target.name }}

            - name: Move Files
              run: |
                  mkdir -p installer/firmware
                  cp .pio/build/${{ matrix.target.name }}/firmware.bin installer/ota_update.bin
                  cp .pio/build/${{ matrix.target.name }}/firmware.bin installer/firmware/
                  cp .pio/build/${{ matrix.target.name }}/bootloader.bin installer/firmware/
                  cp .pio/build/${{ matrix.target.name }}/partitions.bin installer/firmware/
                  cp .pio/build/${{ matrix.target.name }}/spiffs.bin installer/firmware/
                  cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin installer/firmware/

            - name: Merge for web flashing
              run: |
                  # El offset de SPIFFS sale de la tabla de particiones compilada (no de la matriz): con default_8MB (T-Beam Supreme)
                  # SPIFFS esta en 0x670000 y el valor fijo 0x310000 solapaba con la aplicacion (esptool 5.6: 'Detected overlap')
                  SPIFFS_OFFSET=$(python3 - <<'PY'
                  import struct
                  d = open("installer/firmware/partitions.bin", "rb").read()
                  off = "${{ matrix.target.spiffs_offset }}"
                  for i in range(0, len(d) - 31, 32):
                      magic, typ, sub, o, size = struct.unpack("<HBBII", d[i:i + 12])
                      if magic != 0x50AA:
                          break
                      if typ == 1 and sub == 0x82:
                          off = hex(o)
                  print(off)
                  PY
                  )
                  echo "SPIFFS offset: $SPIFFS_OFFSET"
                  if [ "${{ matrix.target.chip }}" == "esp32" ]; then
                    esptool --chip esp32 merge-bin \
                      -o installer/web_factory.bin \
                      --flash-mode dio \
                      --flash-freq 40m \
                      --flash-size 4MB \
                      0x1000 installer/firmware/bootloader.bin \
                      0x8000 installer/firmware/partitions.bin \
                      0xe000 installer/firmware/boot_app0.bin \
                      0x10000 installer/firmware/firmware.bin \
                      0x3D0000 installer/firmware/spiffs.bin
                  elif [ "${{ matrix.target.chip }}" == "esp32s2" ]; then
                    esptool --chip esp32s2 merge-bin \
                      -o installer/web_factory.bin \
                      --flash-mode dio \
                      --flash-freq 40m \
                      --flash-size 4MB \
                      0x1000 installer/firmware/bootloader.bin \
                      0x8000 installer/firmware/partitions.bin \
                      0xe000 installer/firmware/boot_app0.bin \
                      0x10000 installer/firmware/firmware.bin \
                      0x3D0000 installer/firmware/spiffs.bin
                  elif [ "${{ matrix.target.chip }}" == "esp32s3" ]; then
                      esptool --chip esp32s3 merge-bin \
                        -o installer/web_factory.bin \
                        --flash-mode ${{ matrix.target.flash_mode }} \
                        --flash-size ${{ matrix.target.flash_size }} \
                        0x0000   installer/firmware/bootloader.bin \
                        0x8000   installer/firmware/partitions.bin \
                        0xe000   installer/firmware/boot_app0.bin \
                        0x10000  installer/firmware/firmware.bin \
                        $SPIFFS_OFFSET installer/firmware/spiffs.bin
                  elif [ "${{ matrix.target.chip }}" == "esp32c3" ]; then
                    esptool --chip esp32c3 merge-bin \
                      -o installer/web_factory.bin \
                      --flash-mode dio \
                      --flash-freq 40m \
                      --flash-size 4MB \
                      0x0000 installer/firmware/bootloader.bin \
                      0x8000 installer/firmware/partitions.bin \
                      0xe000 installer/firmware/boot_app0.bin \
                      0x10000 installer/firmware/firmware.bin \
                      0x3D0000 installer/firmware/spiffs.bin
                  fi

            - name: Web installer files (images, manifest, update info)
              run: |
                  python3 tools/make_web_assets.py board \
                    --board ${{ matrix.target.name }} \
                    --chip ${{ matrix.target.chip }} \
                    --build-dir .pio/build/${{ matrix.target.name }} \
                    --boot-app0 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
                    --out web_site

            - name: Upload web files
              uses: actions/upload-artifact@v7
              with:
                  name: web-${{ matrix.target.name }}
                  path: web_site
                  retention-days: 7

            - name: Install Zip
              run: sudo apt-get install zip

            - name: Archive Files
              run: zip -r installer.zip installer/

            - name: Rename zip for upload
              run: mv installer.zip ${{ matrix.target.name }}.zip

            - name: Upload build artifact (manual run)
              if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.target.name }}
                  path: ${{ matrix.target.name }}.zip
                  retention-days: 30

            # 45 jobs upload at the same time and GitHub sometimes answers with a transient HTTP error (that blocked the installer deployment
            # in 5.3.2): retry with a random pause. If it still fails, warn but do not stop the web installer; the .zip stays as a workflow artifact.
            - name: Upload Release Asset
              if: github.event_name == 'release' || inputs.tag != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
                  ASSET: ${{ matrix.target.name }}.zip
              run: |
                  for attempt in 1 2 3 4 5 6; do
                      if gh release upload "$RELEASE_TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"; then exit 0; fi
                      echo "Upload attempt $attempt failed; retrying"
                      sleep $(( attempt * 10 + RANDOM % 25 ))
                  done
                  echo "::warning::$ASSET could not be attached to release $RELEASE_TAG (available as a workflow artifact)"

    # Web installer + update information (GitHub Pages). Only for a published (non pre-release) release:
    # the trackers that have automatic update enabled read this site, so a test build must never reach it.
    pages:
        if: (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: pages
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.tag }}

            - uses: actions/download-artifact@v8
              with:
                  pattern: web-*
                  merge-multiple: true
                  path: site

            # Rotor y Gateway en el mismo instalador (lanzadores rotor/ y gateway/): su release con la MISMA version adjunta
            # web-site-<dispositivo>.zip. Son repositorios privados: hace falta el secreto FLASHER_TOKEN (token de acceso de grano
            # fino con permiso de lectura de "Contents" en esos dos repositorios). Sin el secreto o sin esa release, el instalador
            # muestra "aun no hay version publicada" en ese dispositivo y el del tracker se publica igual.
            - name: Rotor y Gateway (misma version)
              env:
                  GH_TOKEN: ${{ secrets.FLASHER_TOKEN }}
                  TAG: ${{ github.event.release.tag_name || inputs.tag }}
              run: |
                  for dev in rotor gateway; do
                      if [ "$dev" = rotor ]; then repo=EA7JRS/APRS-LoRa-Plus-Rotor; else repo=EA7JRS/APRS-LoRa-Plus-I-Gateway; fi
                      if [ -z "$GH_TOKEN" ]; then echo "::warning::Sin el secreto FLASHER_TOKEN: el instalador no incluye $dev"; continue; fi
                      rm -rf "/tmp/$dev"
                      if gh release download "$TAG" --repo "$repo" --pattern "web-site-$dev.zip" --dir "/tmp/$dev"; then
                          mkdir -p "site/$dev" && unzip -q -o "/tmp/$dev/web-site-$dev.zip" -d "site/$dev"
                          echo "$dev: $(python3 -c "import json;print(json.load(open('site/$dev/latest.json'))['version'])")"
                      else
                          echo "::warning::$repo no tiene la release $TAG con web-site-$dev.zip"
                      fi
                  done

            - name: Build site
              run: python3 tools/make_web_assets.py site --root site --page web/index.html

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site

            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5
