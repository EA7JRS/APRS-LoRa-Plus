name: Size report

on:
    workflow_dispatch:

jobs:
    size:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
              target:
                - name: ttgo-t-beam-v1_2
                  tool: xtensa-esp32-elf
                - name: ttgo_t_beam_s3_SUPREME_v3
                  tool: xtensa-esp32s3-elf
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
            - name: Install PlatformIO Core
              run: pip install --upgrade platformio
            - name: Build target
              run: pio run -e ${{ matrix.target.name }}
              continue-on-error: true
            - name: Report
              run: |
                  B=.pio/build/${{ matrix.target.name }}
                  ls -l $B/firmware.bin $B/firmware.elf || true
                  T=$(dirname $(find ~/.platformio/packages -name '${{ matrix.target.tool }}-nm' | head -1))
                  echo "toolchain: $T"
                  $T/${{ matrix.target.tool }}-size -A $B/firmware.elf | head -40
                  echo "=== top symbols"
                  $T/${{ matrix.target.tool }}-nm --size-sort -S -C $B/firmware.elf | tail -70
                  echo "=== per library archive (bytes of .text+.rodata)"
                  for a in $(find $B -name '*.a'); do echo "$($T/${{ matrix.target.tool }}-size -t $a | tail -1 | awk '{print $1+0}') $a"; done | sort -rn | head -25
                  echo "=== project objects"
                  for o in $(find $B/src -name '*.o'); do echo "$($T/${{ matrix.target.tool }}-size $o | tail -1 | awk '{print $1}') $o"; done | sort -rn | head -15
                  echo "=== all project objects"
                  for o in $(find $B/src -name '*.o'); do echo "$($T/${{ matrix.target.tool }}-size $o | tail -1 | awk '{print $1}') $o"; done | sort -rn | sed 's|^\([0-9]*\) .*/src/|\1 |'
                  echo "=== linked symbols by group (bytes in the final image)"
                  $T/${{ matrix.target.tool }}-nm --size-sort -S -C $B/firmware.elf > /tmp/syms.txt
                  python3 - <<'PY'
                  import re, collections
                  rules = [
                      ("SAT", r"SGP4|SatCore|SAT_Utils|SATRX|SATTX|drawSatPage"),
                      ("ROTOR", r"(?i)rotor"),
                      ("BLE (NimBLE + control)", r"NimBLE|^ble_|BLE_|BLEControl|ble_control"),
                      ("CONFIG + WEB", r"Configuration|WEB_Utils|AsyncWeb"),
                      ("SCREEN + MENUS", r"PAGES_Utils|MENU_Utils|KEYBOARD_Utils|Adafruit|drawCompass|icon\("),
                      ("FW-UPDATE + TLS/HTTP", r"FW_Update|HTTPClient|ssl|mbedtls"),
                      ("SENSORS", r"WMM|MAG_|IMU_|WX_|POWER_|SENSORS_"),
                      ("RADIO + MODES", r"FX25|LoRa_Utils|SX126x|SX127x|SX128x|WSPR|FT8|LRFHSS|RadioLib"),
                  ]
                  t = collections.Counter()
                  for line in open("/tmp/syms.txt"):
                      p = line.split(None, 3)
                      if len(p) < 4 or p[2] not in "TtWwDdRrVv":
                          continue
                      g = "other"
                      for name, rx in rules:
                          if re.search(rx, p[3]):
                              g = name
                              break
                      t[g] += int(p[1], 16)
                  for g, n in t.most_common():
                      print(n, g)
                  PY
