name: Commit Test Build

on:
    push:
        branches:
            - '*'
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
              target:
                - name: ttgo-t-beam-v1_2
                  chip: esp32
                - name: ttgo_t_beam_s3_SUPREME_v3
                  chip: esp32s3
                - name: lilygo_t_twr_plus
                  chip: esp32s3
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install PlatformIO Core
              run: pip install --upgrade platformio

            - name: Build target
              run: pio run -e ${{ matrix.target.name }}

            - name: Build FS
              run: pio run --target buildfs -e ${{ matrix.target.name }}

    afsk:
        # Modems de la T-TWR (AFSK 1200, G3RUH 9600, IL2P, M17): pruebas en el PC
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: AFSK 1200
              run: |
                  g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude tools/afsk/test_afsk.cpp src/afsk1200.cpp src/ax25_g3ruh.cpp src/fx25.cpp src/il2p.cpp -o /tmp/test_afsk
                  /tmp/test_afsk
                  g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude tools/afsk/test_g3ruh.cpp src/g3ruh_modem.cpp src/ax25_g3ruh.cpp src/fx25.cpp src/il2p.cpp -o /tmp/test_g3ruh
                  /tmp/test_g3ruh
                  g++ -O2 -Iinclude tools/il2p/test_il2p.cpp src/il2p.cpp src/fx25.cpp src/ax25_g3ruh.cpp -o /tmp/test_il2p
                  /tmp/test_il2p tools/il2p/vectors.txt
            - name: M17
              run: |
                  # libm17 en C (cada fichero por separado: los nombres se repiten en subcarpetas) y el modem M17 en C++
                  mkdir -p /tmp/m17o
                  for f in $(find lib/libm17/src -name '*.c'); do gcc -O2 -Ilib/libm17/src -c "$f" -o "/tmp/m17o/$(echo "$f" | tr / _).o"; done
                  g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude -Ilib/libm17/src tools/afsk/test_m17.cpp src/m17_modem.cpp /tmp/m17o/*.o -lm -o /tmp/test_m17
                  /tmp/test_m17
